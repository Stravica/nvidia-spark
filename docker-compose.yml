          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-qwen3-32b-fp8:
    image: ollama/ollama:latest
    container_name: ollama-qwen3-32b-fp8
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "-1"              # Never unload (match vLLM behavior)
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "8"             # Concurrent requests
      OLLAMA_MAX_LOADED_MODELS: "1"        # Only Qwen3-32B
      OLLAMA_NUM_THREADS: "20"             # Match ARM cores
    volumes:
      - /opt/ollama:/root/.ollama
      - ./models/ollama/Modelfile-qwen3-32b-fp8:/root/Modelfile-qwen3-32b-fp8:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull qwen3:32b-q8_0
        ollama create qwen3-32b-fp8 -f /root/Modelfile-qwen3-32b-fp8
        wait
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Qwen3.8-27B dense, NVFP4 pre-quantized.
  # Image is the vLLM DGX Spark recipe build (sm_121-native, v0.24.0-ubuntu2404).
  # Uses MTP speculative decoding (num_speculative_tokens=3) for ~2x single-stream
  # decode on this model. See docs/vllm/qwen38-27b-nvfp4.md for the full rationale
  # behind every flag, image pinning, checkpoint choice, and measured benchmarks.
  # Only one :8000 binding runs at a time.
  vllm-qwen38-27b-nvfp4:
    image: vllm/vllm-openai:v0.24.0-ubuntu2404
    container_name: vllm-qwen38-27b-nvfp4
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN}"
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    command:
      - unsloth/Qwen3.8-27B-NVFP4
      - --served-model-name
      - qwen38-27b-nvfp4
      - --download-dir
      - /root/.cache/huggingface
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.50"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "8192"
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - --speculative-config
      - '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3}'
      - --load-format
      - fastsafetensors
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
      - --trust-remote-code
      - --limit-mm-per-prompt
      - '{"image": 0, "video": 0}'
    volumes:
      - /opt/hf:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Qwen3.8-Flash-Next MoE (125B main + 51B n-gram embeddings, 6B active), NVFP4
  # pre-quantised. Added 2026-08-27. Serves the 44 GiB n-gram (PLE) table from NVMe
  # via mmap so the resident weights drop from 122 GiB to ~76 GiB and fit alongside
  # a real KV cache in the 128 GB unified pool. See docs/vllm/qwen38-flash-next-nvfp4.md
  # for the recipe (base image + one Python patch), the two mandatory GB10 workarounds,
  # and measured performance.
  #
  # Image is a locally-built patched variant of vllm/vllm-openai:qwen38-flash-next:
  #   git clone https://github.com/blazux/qwen3.8-Flash-DGX.git
  #   cd qwen3.8-Flash-DGX && docker build -t qwen38-flash-dgx .
  # The clone plus checkpoint download (~122 GiB into /opt/hf) must both be present
  # before `docker compose up -d vllm-qwen38-flash-next-nvfp4`. Only one :8000 binding
  # runs at a time, so this service and vllm-qwen38-27b-nvfp4 are mutually exclusive.
  vllm-qwen38-flash-next-nvfp4:
    image: qwen38-flash-dgx:latest
    container_name: vllm-qwen38-flash-next-nvfp4
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN}"
      HF_HOME: /root/.cache/huggingface
      VLLM_PLE_MMAP: "1"
      VLLM_PLE_MMAP_WORKERS: "32"
      VLLM_PLE_MMAP_PREWARM: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
    ipc: host
    shm_size: 16g
    ulimits:
      memlock: -1
      stack: 67108864
    command:
      - RadixArk/Qwen3.8-Flash-Next-NVFP4
      - --served-model-name
      - qwen38-flash-next
      - --download-dir
      - /root/.cache/huggingface
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --load-format
      - safetensors
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "2"
      - --gpu-memory-utilization
      - "0.78"
      - --no-enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - "8192"
      - '-cc.cudagraph_mode=PIECEWISE'
      - '-cc.splitting_ops=["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen3_8_flash_next_ple_short_conv","vllm::qwen3_8_flash_next_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::sparse_attn_indexer","vllm::ple_mmap_lookup"]'
      - --no-enable-flashinfer-autotune
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2}'
    volumes:
      - /opt/hf:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  qwen35-pip-cache:

