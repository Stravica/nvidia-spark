    environment:
      HF_TOKEN: "${HF_TOKEN}"
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN}"
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    entrypoint: ["/bin/bash", "/scripts/start-qwen35.sh"]
    command:
      - Qwen/Qwen3.5-35B-A3B-FP8
      - --served-model-name
      - qwen35-35b-a3b-fp8
      - --download-dir
      - /root/.cache/huggingface
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.80"
      - --max-num-batched-tokens
      - "16384"
      - --max-num-seqs
      - "64"
      - --enable-prefix-caching
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --limit-mm-per-prompt
      - '{"image": 0, "video": 0}'
    volumes:
      - /opt/hf:/root/.cache/huggingface
      - ./scripts:/scripts:ro
      - qwen35-pip-cache:/pip-cache
    deploy:
